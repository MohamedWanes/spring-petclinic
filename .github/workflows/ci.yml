name: Spring Petclinic CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout source code
      - name: Checkout source code
        uses: actions/checkout@v5

      # 2. Setup Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # 3. Build application and run tests
      - name: Build application and run tests
        run: ./mvnw clean test -Dtest='!PostgresIntegrationTests'

      # 4. Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 5. Build Docker image
      - name: Build Docker image
        run: |
          docker build \
            -t mohamedwanes126/spring-petclinic:latest \
            -t mohamedwanes126/spring-petclinic:${{ github.sha }} \
            .

      # 6. Push Docker image
      - name: Push Docker image
        run: |
          docker push mohamedwanes126/spring-petclinic:latest
          docker push mohamedwanes126/spring-petclinic:${{ github.sha }}
