name: Spring Petclinic CD

on:
  workflow_run:
    workflows: ["Spring Petclinic CI"]
    types:
      - completed

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: self-hosted

    steps:
      # 1. Checkout the exact commit produced by CI
      - name: Checkout source code
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      # 2. Verify Kubernetes cluster
      - name: Verify Kubernetes cluster
        run: |
          kubectl cluster-info
          kubectl get nodes

      # 3. Create or update MySQL secret
      - name: Create or update MySQL secret
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
        run: |
          kubectl create secret generic mysql-secret \
            --from-literal=MYSQL_ROOT_PASSWORD="$MYSQL_ROOT_PASSWORD" \
            --from-literal=MYSQL_PASSWORD="$MYSQL_PASSWORD" \
            --dry-run=client -o yaml | kubectl apply -f -

      # 4. Apply Kubernetes manifests
      - name: Apply Kubernetes manifests
        run: |
          kubectl apply -f k8s/mysql.yml
          kubectl apply -f k8s/petclinic.yml

      # 5. Wait for MySQL rollout
      - name: Verify MySQL rollout
        run: |
          kubectl rollout status statefulset/mysql --timeout=180s

      # 6. Verify Petclinic rollout
      - name: Verify Petclinic rollout
        run: |
          kubectl rollout status deployment/petclinic --timeout=180s

      # 7. Verify running pods and services
      - name: Verify Kubernetes resources
        run: |
          kubectl get pods
          kubectl get pvc
          kubectl get svc

      # 8. Verify application accessibility
      - name: Verify application accessibility
        run: |
          kubectl port-forward service/petclinic 8080:8080 >/tmp/petclinic-port-forward.log 2>&1 &
          PF_PID=$!

          trap 'kill $PF_PID' EXIT

          for i in {1..30}; do
            if curl -fsS http://localhost:8080 >/dev/null; then
              echo "Petclinic is accessible"
              exit 0
            fi
            sleep 2
          done

          echo "Petclinic is not accessible"
          cat /tmp/petclinic-port-forward.log
          exit 1
